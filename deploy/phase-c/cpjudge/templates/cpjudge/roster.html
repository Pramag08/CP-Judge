{% extends "base.html" %}
{% block body %}
<p>{{ contest.name }}</p>
<table class="table"><thead><tr><th>ID / handle</th><th>First name</th><th>Last name</th><th>Email</th></tr></thead>
<tbody>{% for row in rows %}<tr><td>{{ row['college_id'] }}</td><td>{{ row['user__user__first_name'] }}</td><td>{{ row['user__user__last_name'] }}</td><td>{{ row['user__user__email'] }}</td></tr>{% endfor %}</tbody></table>
<form method="post" action="{{ url('cpj_export', contest=contest.key) }}">{% csrf_token %}<button type="submit">Export roster</button></form>
{% endblock %}
