{% extends "base.html" %}
{% block body %}
<div class="content-description">
    <p><strong>Contest: {{ contest.name }}</strong> · <a href="{{ url('cpj_contest_edit',contest_key=contest.key) }}">Back to draft</a></p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="package">Polygon ZIP package (maximum {{ maximum_label }})</label>
            <input id="package" name="package" type="file" accept=".zip,application/zip" required>
        </div>
        <button class="btn btn-primary" type="submit">Import ZIP</button>
    </form>
    <p>The package stays private while conversion and the judge check run.</p>
</div>
{% endblock %}
